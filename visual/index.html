<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Vizardry visual fixtures</title>
<link rel="stylesheet" href="../styles.css">
<style>
  /* A fixed, minimal subset of the Obsidian theme variables the plugin reads,
     so rendering is deterministic across runs (the real theme is injected by
     the host at runtime; here we only need run-to-run stability).

     Declared on `.theme-light` as well as `:root`, mirroring how Obsidian scopes
     its palettes: that is what lets a forced-light capture put `theme-light` on
     a single canvas root inside an otherwise dark page and have every variable
     resolve light for that subtree (see prepareForCapture in
     src/renderer/controls.ts). */
  :root, .theme-light {
    --background-primary: #ffffff;
    --background-primary-alt: #f6f6f6;
    --background-secondary: #f2f3f5;
    --background-secondary-alt: #e3e5e8;
    --background-modifier-border: #dcddde;
    --background-modifier-hover: #eaeaea;
    --text-normal: #1f2328;
    --text-muted: #6a6f76;
    --text-faint: #999da3;
    --text-on-accent: #ffffff;
    --interactive-accent: #5b61e6;
    --interactive-accent-hover: #4a50d0;
    /* Accent decomposition (Obsidian exposes these; ≈ #5b61e6) — canvases derive
       harmonised palettes by rotating the hue and keeping this S/L. */
    --accent-h: 238;
    --accent-s: 74%;
    --accent-l: 63%;
    --font-text-size: 16px;
    /* Obsidian's default interface font-size ramp. Without these, every
       canvas's var(--font-ui-small)-based sizing collapses to the browser
       default (16px flat), so the harness would not reflect real typography. */
    --font-ui-smaller: 13px;
    --font-ui-small: 14px;
    --font-ui-medium: 16px;
    --font-ui-large: 20px;
    --font-interface: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  /* Obsidian's dark palette, same subset. Applied to <body> by the harness for
     the ?dark fixtures, so a canvas that leaks a dark variable into a
     forced-light capture shows up as a snapshot diff. */
  .theme-dark {
    --background-primary: #1e1e1e;
    --background-primary-alt: #1a1a1a;
    --background-secondary: #252525;
    --background-secondary-alt: #161616;
    --background-modifier-border: #3f3f3f;
    --background-modifier-hover: #2d2d2d;
    --text-normal: #dadada;
    --text-muted: #9a9a9a;
    --text-faint: #6b6b6b;
    --text-on-accent: #ffffff;
  }
  html, body { margin: 0; background: var(--background-primary); color: var(--text-normal);
    font-family: var(--font-interface); }
  #app { display: flex; flex-direction: column; gap: 24px; padding: 20px; }
  section { border: 1px dashed #ccc; padding: 12px; }
  section > h2 { font: 600 13px var(--font-interface); color: #888;
    text-transform: uppercase; letter-spacing: .04em; margin: 0 0 10px; }
</style>
</head>
<body>
<div id="app"></div>
<script src="dist/harness.js"></script>
</body>
</html>
