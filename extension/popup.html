<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body {
    width: 240px;
    margin: 0;
    padding: 16px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #fff;
    color: #1f2328;
  }
  .header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
  }
  .header img {
    width: 28px;
    height: 28px;
  }
  .header h1 {
    font-size: 16px;
    font-weight: 600;
    margin: 0;
  }
  p {
    font-size: 13px;
    color: #6a6f76;
    margin: 0 0 14px;
    line-height: 1.4;
  }
  button {
    display: block;
    width: 100%;
    padding: 9px 0;
    border: none;
    border-radius: 6px;
    background: #5b61e6;
    color: #fff;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover { background: #4a50d0; }
</style>
</head>
<body>
  <div class="header">
    <img src="icons/icon-48.png" alt="">
    <h1>Vizardry</h1>
  </div>
  <p>Paste or open a Markdown file to render vizardry canvases.</p>
  <button id="open">Open Viewer</button>
  <script src="dist/popup.js"></script>
</body>
</html>
