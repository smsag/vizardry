name: Verify

# Reusable verification pipeline: install, typecheck, lint, test, docs-check,
# build. Called by both ci.yml (on push/PR) and release.yml (as a gate before
# publishing) so a release runs the exact same checks as CI — no drift.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Docs check
        run: bash scripts/docs-check.sh

      - name: Build
        run: npm run build
