name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs for the same ref (new push to a PR supersedes the old).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Inline job named `ci` so the required status check stays `ci` — matching
  # branch protection on main. The pipeline itself lives in the composite
  # action .github/actions/verify, shared with release.yml's gate so the two
  # can't drift.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/verify
