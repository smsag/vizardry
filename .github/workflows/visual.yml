name: Visual

# Visual-regression check. Runs in the Playwright container whose bundled
# Chromium (build 1194) matches @playwright/test@1.56.0 — the same build the
# committed baselines were rendered with — so screenshots line up. Kept as its
# own workflow (a separate `visual` check, not the required `ci` check) so a
# rendering diff surfaces without blocking merges; promote it in branch
# protection once it's proven stable. Regenerate baselines with
# `npm run test:visual:update` in this same container/version.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-noble
    env:
      # Browsers are preinstalled in the container; don't re-download on npm ci.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # On failure, `npm run test:visual` locally reproduces the pixel diff
      # against these same baselines.
      - name: Visual regression
        run: npm run test:visual
