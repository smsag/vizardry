name: Verify
description: >-
  Single source of truth for the verification pipeline — install, type-check,
  lint, test, docs-check, build. Used by ci.yml (PR/push) and release.yml (as a
  gate) so the two can never drift. The caller must check out the repo first
  (composite actions do not check out); job names stay owned by the caller, so
  ci.yml's required `ci` status check is unaffected.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm

    - run: npm ci
      shell: bash
      env:
        # No browsers needed for the unit pipeline; the visual workflow runs in
        # a Playwright container that already has them.
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

    - name: Type-check (plugin + extension)
      run: npm run typecheck
      shell: bash

    - name: Lint
      run: npm run lint
      shell: bash

    - name: Test
      run: npm test
      shell: bash

    - name: Docs check
      run: bash scripts/docs-check.sh
      shell: bash

    - name: CSS reference check
      run: node scripts/css-check.mjs
      shell: bash

    - name: Build
      run: npm run build
      shell: bash

    - name: Build extension
      run: npm run ext:build
      shell: bash
