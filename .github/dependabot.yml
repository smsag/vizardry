version: 2
updates:
  # Keep the pinned action SHAs current (Dependabot bumps the SHA + comment).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    # Group dev-dependency bumps so lint/test/build tooling updates land together.
    groups:
      dev-dependencies:
        dependency-type: development
    # Hold TypeScript at its current major: @typescript-eslint caps its peer at
    # "<6.1.0", so a TS major (e.g. 7.x) breaks `npm ci` for the whole group.
    # Revisit once @typescript-eslint supports the newer TypeScript major.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
