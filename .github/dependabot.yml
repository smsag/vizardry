version: 2
updates:
  # Keep the pinned action SHAs current (Dependabot bumps the SHA + comment).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    # Group dev-dependency bumps so lint/test/build tooling updates land together.
    groups:
      dev-dependencies:
        dependency-type: development
